# Qwen3.5-35B-A3B via local vLLM OpenAI-compatible server
# Start the server first with run_qwen35_server.sh, then run the pipeline.
llm:
  backend: "openai"
  model_name: "Qwen/Qwen3.5-35B-A3B"
  temperature: 0.7
  max_tokens: 4096
  base_url: "http://localhost:8001/v1"
  api_key: "dummy"  # vLLM server does not require a real key

processing:
  chunk_size: 5000
  chunk_overlap: 500
  max_retries: 3
  retry_delay: 5

paths:
  cache_dir: "./model_cache"
  output_dir: "./outputs"
