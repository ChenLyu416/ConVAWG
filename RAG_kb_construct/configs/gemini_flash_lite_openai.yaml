# Gemini Flash Lite via OpenAI-compatible endpoint (backbone ablation)
# Requires GEMINI_API_KEY (or OPENAI_API_KEY set to Gemini key) in environment.
llm:
  backend: "openai"
  model_name: "gemini-3.1-flash-lite"
  temperature: 0.7
  max_tokens: 4096
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: null  # read from GEMINI_API_KEY or OPENAI_API_KEY env var

processing:
  chunk_size: 5000
  chunk_overlap: 500
  max_retries: 3
  retry_delay: 5

paths:
  cache_dir: "./model_cache"
  output_dir: "./outputs"
