# LLaMA-3.1-8B-Instruct via vLLM backend (backbone ablation generation)
llm:
  backend: "vllm"
  model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  temperature: 0.7
  max_tokens: 4096
  # vLLM server (OpenAI-compatible). Start the server separately, e.g.:
  #   python -m vllm.entrypoints.openai.api_server --model <model_name> \
  #       --port 8000 --tensor-parallel-size 4 --max-model-len 32768
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"

processing:
  chunk_size: 5000
  chunk_overlap: 500
  max_retries: 3
  retry_delay: 5

paths:
  cache_dir: "./model_cache"
  output_dir: "./outputs"
